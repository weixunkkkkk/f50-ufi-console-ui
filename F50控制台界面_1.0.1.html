  shadow.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>openView(e.dataset.view));
  q('networkNavToggle').onclick=()=>{setNetworkExpanded(q('networkNavChildren').hidden);showWorkspace('network',true);};
  let nativeDialog=null;
  function showNativePanel(kind){
    const nodes=(kind==='inlineBands'?[document.querySelector('.band-lock-container'),document.querySelector('.freq-lock-container')]:[document.getElementById(kind==='inlineSignal'?'SIGNAL_MONITOR':'TM_GLASS_V10')]).filter(Boolean);
    if(!nodes.length)return;
    nativeDialog=document.createElement('dialog');nativeDialog.id='f50-native-dialog';
    const close=document.createElement('button');close.textContent='关闭';close.className='btn';close.style.cssText='float:right;padding:8px 15px';close.onclick=()=>nativeDialog.close();nativeDialog.appendChild(close);
    const positions=nodes.map(node=>{const marker=document.createComment('f50-console-native-slot');node.before(marker);nativeDialog.appendChild(node);return{node,marker};});
    nativeDialog.addEventListener('close',()=>{positions.forEach(({node,marker})=>marker.replaceWith(node));nativeDialog.remove();nativeDialog=null;},{once:true});document.body.appendChild(nativeDialog);nativeDialog.showModal();
  }
  function drawChart(){
    const now=Date.now(),visible=samples.filter(s=>now-s.at<=range),max=Math.max(1,...visible.flatMap(s=>[s.down,s.up]));
    const path=key=>visible.map((s,i)=>{const x=600*(1-(now-s.at)/range),y=110-Math.min(1,s[key]/max)*90;return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join('');
    const down=path('down'),up=path('up');q('downloadPath').setAttribute('d',down);q('uploadPath').setAttribute('d',up);
    q('chartArea').setAttribute('d',visible.length>1?down+'L600 118L'+(600*(1-(now-visible[0].at)/range)).toFixed(1)+' 118Z':'');
    q('f50-chart-note').style.display=visible.length>1?'none':'';
    q('chartFrom').textContent=range===60000?'60 秒前':range/60000+' 分钟前';
  }
  shadow.querySelectorAll('[data-range]').forEach((b,i)=>b.onclick=()=>{range=[60000,300000,1800000][i];shadow.querySelectorAll('[data-range]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawChart();});
  function render(){
    const fresh=isFresh(),d=fresh?data():{},type=network(d),online=fresh&&String(d.ppp_status||'').includes('connected')&&!String(d.ppp_status).includes('disconnected');
    const rx=val(d.realtime_rx_thrpt),tx=val(d.realtime_tx_thrpt);
    put('f50-download',rx===null?'—':(rx*8/1e6).toFixed(2));put('f50-upload',tx===null?'—':(tx*8/1e6).toFixed(2));
    put('f50-network',type);put('f50-net-type',type);put('f50-carrier',d.network_provider||'等待网络状态');put('f50-radio',type==='5G'?'NR · 蜂窝网络':type==='4G'?'LTE · 蜂窝网络':'蜂窝网络');
    put('f50-band',d.Nr_bands?'N'+d.Nr_bands:(d.Lte_bands?'B'+d.Lte_bands:'—'));
    put('f50-settings-network',type);put('f50-settings-band',q('f50-band').textContent);put('f50-settings-rsrp',number(d.Z5g_rsrp??d.lte_rsrp,0)+' dBm');
    const currentBand=q('f50-band').textContent,labels=shadow.querySelectorAll('.spectrum-labels>*');
    const bandRow=[...document.querySelectorAll('#bandTable tr')].find(row=>row.cells?.[1]?.textContent.trim()===currentBand);
    const frequency=bandRow?.cells?.[2]?.textContent.trim()||'';
    const bounds=frequency.match(/(\d+)\s*[–—-]\s*(\d+)/);
    labels[0].textContent=bounds?bounds[1]+' MHz':frequency?frequency+' MHz':'频率范围待提供';
    labels[1].textContent=currentBand==='—'?'':currentBand;
    labels[2].textContent=bounds?bounds[2]+' MHz':'';
    shadow.querySelector('.spectrum-line').style.opacity=currentBand==='—'?'0':'.65';
    shadow.querySelector('.spectrum-line').setAttribute('aria-label','当前频段的示意图，非频谱测量');
    put('f50-rsrp',number(d.Z5g_rsrp??d.lte_rsrp,0));put('f50-sinr',number(d.Nr_snr??d.Lte_snr,0));
    put('f50-temp',val(d.cpu_temp)===null?'—':(d.cpu_temp/1000).toFixed(1));put('f50-memory',number(d.mem_usage,1));put('f50-cpu','CPU '+number(d.cpu_usage,1)+'%');
    put('f50-flow',bytes(d.daily_data));put('f50-month','本月 '+bytes(d.monthly_data)+' GB');put('f50-uptime',time(d.realtime_time));
    put('f50-client-count',val(d.wifi_access_sta_num)===null?'—':String(d.wifi_access_sta_num));put('f50-nav-count',val(d.wifi_access_sta_num)===null?'—':String(d.wifi_access_sta_num));put('f50-client-summary',val(d.wifi_access_sta_num)===null?'等待数据':d.wifi_access_sta_num+' 台 Wi-Fi 设备');put('f50-gateway',d.lan_ipaddr||'—');
    put('f50-data-state',fresh?'设备实时数据':'未登录或数据暂不可用');put('f50-online',fresh?(online?'蜂窝网络已连接':'蜂窝网络未连接'):'等待后台数据');shadow.querySelector('.online').classList.toggle('warning',!online);
    shadow.querySelector('.rate-state>span:first-child').style.background=fresh?'var(--green)':'var(--muted)';
    q('authButton').textContent=String(document.getElementById('NET_TYPE')?.disabled)==='false'&&fresh?'退出登录':'登录后台';
    const bars=val(d.network_signalbar??d.rssi);shadow.querySelectorAll('.signal-bars i').forEach((e,i)=>e.style.opacity=bars!==null&&i<Math.min(5,bars)?'1':'.15');
    const tracks=shadow.querySelectorAll('.temperature-track i');tracks[0].style.width=val(d.cpu_temp)===null?'0%':Math.min(100,Math.max(0,d.cpu_temp/1000))+'%';tracks[1].style.width=val(d.mem_usage)===null?'0%':Math.min(100,Math.max(0,d.mem_usage))+'%';
    if(fresh&&rx!==null&&tx!==null&&updatedAt!==lastSample){samples.push({at:updatedAt,down:rx*8/1e6,up:tx*8/1e6});samples=samples.filter(s=>Date.now()-s.at<=1800000).slice(-3600);lastSample=updatedAt;}
    drawChart();host.dataset.state=fresh?'live':'waiting';
    if(nativeWorkspace.dataset.view==='clients'&&fresh&&!clientsLoaded)loadClients();
  }
  function statusUpdated(){if(nativeStatus.children.length>2&&Object.keys(data()).length){updatedAt=Date.now();}else updatedAt=0;render();}
  const observer=new MutationObserver(statusUpdated);observer.observe(nativeStatus,{childList:true,subtree:true});
  statusUpdated();const timer=setInterval(render,2000);
  window.addEventListener('pagehide',()=>{observer.disconnect();monitorObserver.disconnect();functionObserver?.disconnect();clearInterval(timer);},{once:true});
})();

</script>
